name: Release

# Every download is built here, from the code in this repository, so anyone can check where it came from.
# Pushing a tag like v0.2.2 builds the files and creates a draft release for a maintainer to review.
# Running it by hand (Actions > Release > Run workflow) only builds the files.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Directory.Build.props." }

      - name: Test
        run: dotnet test -c Release --filter "Category!=Integration"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build downloads
        shell: pwsh
        run: ./scripts/publish.ps1

      # Code signing (SignPath) goes here once the project is accepted. See README > Code signing policy.

      - uses: actions/upload-artifact@v4
        with:
          name: PatchLight-downloads
          path: |
            dist/PatchLight-Setup.exe
            dist/PatchLight-win-x64.zip
            dist/patchlight.exe

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PatchLight-Setup.exe dist/PatchLight-win-x64.zip dist/patchlight.exe --draft --generate-notes --title "PatchLight ${{ github.ref_name }}"
